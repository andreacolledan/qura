name: Build and Test

on:
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      - name: Set up cvc5
        run: scripts/setup-cvc5.sh
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}

      - name: Check cvc5
        run: cvc5 --version
        shell: bash

      - name: Build project
        run: |
          stack setup
          stack build --copy-bins
        shell: bash

      - name: Run tests
        run: stack test
        shell: bash

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ~/.local/bin/qura
